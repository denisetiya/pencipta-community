name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/denisetiya/community-assistant

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          source: "deploy/docker-compose.yml"
          target: "/opt/community-assistant"
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          script: |
            set -e
            mkdir -p /opt/community-assistant
            cat > /opt/community-assistant/.env <<'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            AI_BASE_URL=${{ secrets.AI_BASE_URL }}
            ROUTER_NETWORK=${{ secrets.ROUTER_NETWORK || 'home_default' }}
            AI_API_KEY=${{ secrets.AI_API_KEY }}
            AI_MODEL=${{ secrets.AI_MODEL || 'atomix' }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET || '96d8e7c5b4a39281726f1e0d5c4b3a2198765432' }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL || 'http://localhost:8099' }}
            NEXT_PUBLIC_ENABLE_DEVTOOLS=true
            EOF

            # Ensure external router network exists on host
            ROUTER_NET="${{ secrets.ROUTER_NETWORK || 'home_default' }}"
            if [ -n "$ROUTER_NET" ]; then
              docker network inspect "$ROUTER_NET" >/dev/null 2>&1 || docker network create "$ROUTER_NET"
              docker network connect "$ROUTER_NET" home-9router-1 --alias 9router 2>/dev/null || true
            fi

            # Login to GHCR if token is stored in /root/.env
            if [ -f /root/.env ]; then
              GH_TOKEN=$(grep '^GH_TOKEN=' /root/.env | cut -d= -f2)
              if [ -n "$GH_TOKEN" ]; then
                echo "$GH_TOKEN" | docker login ghcr.io -u denisetiya --password-stdin || true
              fi
            fi

            cd /opt/community-assistant
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "Deployment successfully completed. Container status:"
            docker compose ps
