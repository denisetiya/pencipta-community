services:
  app:
    image: ghcr.io/denisetiya/community-assistant:latest
    container_name: community_assistant
    restart: unless-stopped
    ports:
      - "8099:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/hello || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - community

  db:
    image: postgres:16-alpine
    container_name: community_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pencipta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: community_assistant
    ports:
      - "5434:5432"
    volumes:
      - community_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pencipta -d community_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  community:
    driver: bridge

volumes:
  community_pgdata:
