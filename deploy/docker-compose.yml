services:
  app:
    image: ghcr.io/denisetiya/community-assistant:latest
    container_name: community_assistant
    restart: unless-stopped
    ports:
      - "8099:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXT_PUBLIC_ENABLE_DEVTOOLS: ${NEXT_PUBLIC_ENABLE_DEVTOOLS:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - router
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/hello').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: community_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pencipta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: community_assistant
    ports:
      - "5434:5432"
    volumes:
      - community_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pencipta -d community_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  router:
    external: true
    name: ${ROUTER_NETWORK:-home_default}

volumes:
  community_pgdata:
